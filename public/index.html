  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      background: #f0f0f0;
    }
    #output {
      width: 500px;
      height: 200px;
      margin: 40px auto 0 auto;
      display: block;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .piano-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      background: #222;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      overflow-x: auto;
    }
    .piano {
      position: relative;
      height: 120px;
      min-width: 960px;
      display: flex;
    }
    .key.white {
      width: 40px;
      height: 120px;
      background: #fff;
      border: 1px solid #ccc;
      z-index: 1;
      box-sizing: border-box;
      border-radius: 0 0 5px 5px;
      transition: background 0.2s;
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
    }
    .key.white:hover {
      background: #e0f0ff;
    }
    .key.black {
      width: 24px;
      height: 80px;
      background: #000;
      position: absolute;
      z-index: 2;
      border-radius: 0 0 3px 3px;
      box-shadow: 1px 2px 6px rgba(0,0,0,0.3);
      transition: background 0.2s;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .key.black:hover {
      background: #888;
    }
    .key-label {
      font-size: 10px;
      color: #333;
      margin-bottom: 4px;
      pointer-events: none;
      user-select: none;
    }
    .key.black .key-label {
      color: #fff;
    }
  </style>

  <style>
    /* Some basic CSS to make the Audio controls in abcjs presentable. */

.abcjs-inline-audio {
  height: 26px;
  padding: 0 5px;
  border-radius: 3px;
  background-color: #424242;
  display: flex;
  align-items: center;
  box-sizing: border-box;
}

.abcjs-inline-audio.abcjs-disabled {
  opacity: 0.5;
}

.abcjs-inline-audio .abcjs-btn {
  display: block;
  width: 28px;
  height: 34px;
  margin-right: 2px;
  padding: 7px 4px;

  background: none !important;
  border: 1px solid transparent;
  box-sizing: border-box;
  line-height: 1;
}

.abcjs-btn g {
  fill: #f4f4f4;
  stroke: #f4f4f4;
}

.abcjs-inline-audio .abcjs-btn:hover g {
  fill: #cccccc;
  stroke: #cccccc;
}

.abcjs-inline-audio .abcjs-midi-selection.abcjs-pushed {
  border: 1px solid #cccccc;
  background-color: #666666;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-midi-loop.abcjs-pushed {
  border: 1px solid #cccccc;
  background-color: #666666;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-midi-reset.abcjs-pushed {
  border: 1px solid #cccccc;
  background-color: #666666;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-midi-start .abcjs-pause-svg {
  display: none;
}

.abcjs-inline-audio .abcjs-midi-start .abcjs-loading-svg {
  display: none;
}

.abcjs-inline-audio .abcjs-midi-start.abcjs-pushed .abcjs-play-svg {
  display: none;
}

.abcjs-inline-audio .abcjs-midi-start.abcjs-loading .abcjs-play-svg {
  display: none;
}

.abcjs-inline-audio .abcjs-midi-start.abcjs-pushed .abcjs-pause-svg {
  display: block;
}

.abcjs-inline-audio .abcjs-midi-progress-background {
  background-color: #424242;
  height: 10px;
  border-radius: 5px;
  border: 2px solid #cccccc;
  margin: 0 8px 0 15px;
  position: relative;
  flex: 1;
  padding: 0;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-midi-progress-indicator {
  width: 20px;
  margin-left: -10px; /* half of the width */
  height: 14px;
  background-color: #f4f4f4;
  position: absolute;
  display: inline-block;
  border-radius: 6px;
  top: -4px;
  left: 0;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-midi-clock {
  margin-left: 4px;
  margin-top: 1px;
  margin-right: 2px;
  display: inline-block;
  font-family: sans-serif;
  font-size: 16px;
  box-sizing: border-box;
  color: #f4f4f4;
}

.abcjs-inline-audio .abcjs-tempo-wrapper {
  font-size: 10px;
  color: #f4f4f4;
  box-sizing: border-box;
  display: flex;
  align-items: center;
}

.abcjs-inline-audio .abcjs-midi-tempo {
  border-radius: 2px;
  border: none;
  margin: 0 2px 0 4px;
  width: 42px;
  padding-left: 2px;
  box-sizing: border-box;
}

.abcjs-inline-audio .abcjs-loading .abcjs-loading-svg {
  display: inherit;
}

.abcjs-inline-audio .abcjs-loading {
  outline: none;
  animation-name: abcjs-spin;
  animation-duration: 1s;
  animation-iteration-count: infinite;
  animation-timing-function: linear;

}
.abcjs-inline-audio .abcjs-loading-svg circle {
  stroke: #f4f4f4;
}

@keyframes abcjs-spin {
  from {transform:rotate(0deg);}
  to {transform:rotate(360deg);}
}

/* Adding the class "abcjs-large" will make the control easier on a touch device. */
.abcjs-large .abcjs-inline-audio {
  height: 52px;
}
.abcjs-large .abcjs-btn {
  width: 56px;
  height: 52px;
  font-size: 28px;
  padding: 6px 8px;
}
.abcjs-large .abcjs-midi-progress-background {
  height: 20px;
  border: 4px solid #cccccc;
}
.abcjs-large .abcjs-midi-progress-indicator {
  height: 28px;
  top: -8px;
  width: 40px;
}
.abcjs-large .abcjs-midi-clock {
  font-size: 32px;
  margin-right: 10px;
  margin-left: 10px;
  margin-top: -1px;
}
.abcjs-large .abcjs-midi-tempo {
  font-size: 20px;
  width: 50px;
}
.abcjs-large .abcjs-tempo-wrapper {
  font-size: 20px;
}

.abcjs-css-warning {
  display: none;
}

  </style>

}

</head>
<body>

<h1 class="uk-text-large uk-margin-left uk-margin-xsmall">Lapis AI - Online Piano & Score</h1>
<div class="uk-text-default uk-margin-left">prototype updated at: 2025.10.14</div>
  <textarea id="editor" style="width: 100%; height: 10em;">
X: 1
T: Prelude from Cello Suite No. 1 in G Major
C: J. S. Bach
M: 4/4
L: 1/4
Q: 1/4=60
K: G
G,,1/4D,1/4B,1/4A,1/4 B,1/4D,1/4B,1/4D,1/4 G,,1/4D,1/4B,1/4A,1/4 B,1/4D,1/4B,1/4D,1/4|
</textarea>
  <div id="paper"></div>

  <div id="midi"> </div>
  <!-- <button class="activate-audio">Activate Audio</button> -->
  <div class="piano-container">
    <div class="piano" id="piano"></div>
  </div>
  <script>

    window.onload = (event) => {
    'use strict';
    console.log('page is fully loaded on abcjs-editor   ');
    new ABCJS.Editor(
    'editor', {
        'paper_id': 'paper',
        'generate_midi': true,
        'midi_id': 'midi',
        'generate_warnings': true,
        'warnings_id': 'warnings',
        'render_options': {
            'staffwidth': 550,
            'paddingright':0,
            'paddingleft':0
        }
    }
    );
}



    // Piano keys
    const notes = [
      {note: 'C', isWhite: true},
      {note: 'C#', isWhite: false},
      {note: 'D', isWhite: true},
      {note: 'D#', isWhite: false},
      {note: 'E', isWhite: true},
      {note: 'F', isWhite: true},
      {note: 'F#', isWhite: false},
      {note: 'G', isWhite: true},
      {note: 'G#', isWhite: false},
      {note: 'A', isWhite: true},
      {note: 'A#', isWhite: false},
      {note: 'B', isWhite: true}
    ];

    // Generate 4 octaves (C3 to B6)
    const startOctave = 2;
    const octaves = 4;
    const pianoDiv = document.getElementById('piano');
    let whiteKeyPositions = [];
    let whiteKeyCount = 0;

    // Create white keys and keep their positions
    for (let o = startOctave; o < startOctave + octaves; o++) {
      for (let i = 0; i < notes.length; i++) {
        if (notes[i].isWhite) {
          const noteName = notes[i].note + o;
          const key = document.createElement('div');
          key.className = 'key white';
          key.setAttribute('data-note', noteName);
          key.innerHTML = `<span class="key-label">${noteName}</span>`;
          pianoDiv.appendChild(key);
          whiteKeyPositions.push(whiteKeyCount * 40);
          whiteKeyCount++;
        }
      }
    }

    // Create black keys and position them between white keys
    let whiteIndex = 0;
    for (let o = startOctave; o < startOctave + octaves; o++) {
      for (let i = 0; i < notes.length; i++) {
        if (!notes[i].isWhite && notes[i].note !== '') {
          const noteName = notes[i].note + o;
          // Black keys are between white keys, so find their position
          // C# between C and D, D# between D and E, F# between F and G, etc.
          // For each black key, position it at the middle between whiteIndex-1 and whiteIndex
          // Each white key is 40px wide, so black key should be centered at ((whiteKeyPositions[whiteIndex-1] + whiteKeyPositions[whiteIndex]) / 2) - 12px
          if (whiteIndex > 0 && whiteIndex < whiteKeyPositions.length) {
            let left = ((whiteKeyPositions[whiteIndex-1] + whiteKeyPositions[whiteIndex]) / 2) - 12;
            const key = document.createElement('div');
            key.className = 'key black';
            key.setAttribute('data-note', noteName);
            key.style.left = left + 'px';
            key.innerHTML = `<span class="key-label">${noteName}</span>`;
            pianoDiv.appendChild(key);
          }
        }
        if (notes[i].isWhite) {
          whiteIndex++;
        }
      }
    }

    // Setup Tone.js Sampler (only a few samples, rest will be pitch-shifted)
    const sampler = new Tone.Sampler({
      urls: {
        "C4": "C4.mp3",
        "D#4": "Ds4.mp3",
        "F#4": "Fs4.mp3",
        "A4": "A4.mp3"
      },
      release: 1,
      baseUrl: "https://tonejs.github.io/audio/salamander/"
    }).toDestination();

    // Play note on key click and add to VexFlow
    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('click', async () => {
        await Tone.start(); // Required for user gesture in some browsers
        const note = key.getAttribute('data-note');
        sampler.triggerAttackRelease(note, "1n");
        // Add note to stemDownNotes
        // VexFlow expects "C4" as "C4" or "C#4" as "C#4"
        // We'll add as quarter note
        let vfNote = note.replace(/(\d)/, "/q");
        stemDownNotes += ", " + vfNote;
        renderVexFlow();
      });
    });
  </script>
</body>
